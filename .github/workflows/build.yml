name: build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # 固定签名：从仓库 secret 还原 keystore，使每次构建的签名一致（可直接覆盖安装）。
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ci-debug.keystore"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ci-debug.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Verify signing certificate
        env:
          EXPECTED_CERT_SHA256: 57df9c0d999ea701131b4c1b3c9565c545102c030cea1db59645e4e47002f0bd
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK"
          ls -l "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(ls -1 "$SDK"/build-tools/*/apksigner | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          "$APKSIGNER" verify --print-certs "$APK"
          GOT=$("$APKSIGNER" verify --print-certs "$APK" \
            | grep -m1 'certificate SHA-256 digest' \
            | sed 's/.*: *//' \
            | tr 'A-Z' 'a-z' | tr -d ' \n')
          echo "APK certificate SHA-256: $GOT"
          if [ "$GOT" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::签名证书与预期不符：期望 $EXPECTED_CERT_SHA256，实际 $GOT（检查仓库 secrets 与 signingConfigs.ci）"
            exit 1
          fi
          echo "签名校验通过"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coloros-subtitle-unlock-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error