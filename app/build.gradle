plugins {
    id 'com.android.application'
}

// 固定签名：CI 从仓库 secrets 还原 keystore（见 .github/workflows/build.yml）。
// 没有这些环境变量时（例如本地无密钥构建）回退到 AGP 默认 debug 签名。
def ciKeystorePath = System.getenv("KEYSTORE_PATH")
def hasCiKeystore = ciKeystorePath != null && file(ciKeystorePath).exists()

android {
    namespace 'com.lmq.coloros.subtitle'
    compileSdk 35

    defaultConfig {
        applicationId "com.lmq.coloros.subtitle"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (hasCiKeystore) {
            ci {
                storeFile file(ciKeystorePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            if (hasCiKeystore) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // UI 与 hook 侧都用 BuildConfig.APPLICATION_ID 作为 prefs 的模块包名，避免字面量漂移。
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
    // UI 用（Material3）；hook 侧不得引用（见 AGENTS.md 规则 10 / docs/06-module-ui.md §分层约定）
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}