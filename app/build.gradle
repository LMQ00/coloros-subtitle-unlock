plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lmq.coloros.subtitle'
    compileSdk 35

    defaultConfig {
        applicationId "com.lmq.coloros.subtitle"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}